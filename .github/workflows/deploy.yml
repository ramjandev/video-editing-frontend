name: Deploy Frontend to VPS

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    name: Auto Deploy Frontend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Auto-deploying Frontend..."
            TARGET_DIR="$HOME/video-editing-frontend"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "📁 Directory $TARGET_DIR does not exist. Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR" || mkdir -p "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
              git clean -fd
            fi
            docker compose up --build -d
